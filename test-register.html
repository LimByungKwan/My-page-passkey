<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>패스키 추가 등록 기록</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#202d25;font:15px/1.8 "Malgun Gothic",system-ui,sans-serif}main{max-width:900px;margin:40px auto;padding:0 20px}a{color:#1d4d3a}input{display:block;width:100%;padding:12px;font:inherit;border:1px solid #7d897e;border-radius:5px;margin:8px 0 16px}button{font:inherit;background:#1d4d3a;color:white;border:0;border-radius:6px;padding:14px 20px;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px;border:1px solid #c9cec4;border-radius:6px;font:13px/1.7 monospace}#status{white-space:pre-line}</style></head>
<body><main>
<a href="/private.html">← 비공개 노트로 돌아가기</a>
<h1>등록 요청과 공개키 저장 확인</h1>
<p>현재 로그인한 계정에 예비 패스키를 하나 추가합니다. 새 계정은 만들지 않습니다. 세션과 쿠키 값은 기록에 출력하지 않습니다.</p>
<p>기존 패스키와 다른 저장소를 선택하세요. Google 패스키가 남아 있다면 이번에는 Windows Hello를 선택할 수 있습니다.</p>
<form id="form"><label for="name">추가할 패스키 이름</label><input id="name" maxlength="60" required value="Windows Hello 예비 패스키"><button id="run" type="submit">패스키 추가와 등록 기록 남기기</button></form>
<p id="status" role="status" aria-live="polite">비공개 노트에서 계정 A로 로그인한 상태에서 실행하세요.</p>
<div id="records"></div>
<script>
"use strict";
const form=document.getElementById("form");
const button=document.getElementById("run");
const status=document.getElementById("status");
const records=document.getElementById("records");
function decode(value) {
  const base=value.replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(base+"=".repeat((4-base.length%4)%4)),c=>c.charCodeAt(0));
}
function encode(buffer) {
  let value="";
  for(const byte of new Uint8Array(buffer)) value+=String.fromCharCode(byte);
  return btoa(value).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function request(method,body) {
  const response=await fetch("/api/passkeys",{
    method,credentials:"same-origin",cache:"no-store",
    headers:body===undefined?{}:{"Content-Type":"application/json"},
    body:body===undefined?undefined:JSON.stringify(body)
  });
  return {status:response.status,body:await response.json()};
}
function record(title,method,body,response) {
  const heading=document.createElement("h2");
  heading.textContent=title;
  const pre=document.createElement("pre");
  pre.textContent=JSON.stringify({
    time:new Date().toISOString(),
    request:{method,path:"/api/passkeys",body},
    response
  },null,2);
  records.append(heading,pre);
}
form.addEventListener("submit",async event=>{
  event.preventDefault();
  if(button.disabled)return;
  button.disabled=true;
  records.replaceChildren();
  let created=false;
  let saved=false;
  try {
    if(!window.isSecureContext||!window.PublicKeyCredential)throw new Error("HTTPS 주소에서 패스키 지원 브라우저로 열어 주세요.");
    status.textContent="현재 계정의 패스키 목록을 확인합니다.";
    const before=await request("GET");
    if(before.status!==200)throw new Error(before.body.error||"먼저 계정 A로 로그인하세요.");
    record("0. 등록 전 패스키 목록","GET",undefined,before);
    const name={passkeyName:document.getElementById("name").value.trim()};
    const issued=await request("POST",name);
    record("1. 서버의 새 등록 질문","POST",name,issued);
    if(issued.status!==200)throw new Error(issued.body.error||"질문 발급 실패");
    const options=issued.body.options;
    status.textContent="기기 창에서 Windows Hello 등 기존 패스키와 다른 저장소를 선택하세요.";
    const credential=await navigator.credentials.create({publicKey:{
      ...options,challenge:decode(options.challenge),
      user:{...options.user,id:decode(options.user.id)},
      excludeCredentials:(options.excludeCredentials||[]).map(item=>({...item,id:decode(item.id)}))
    }});
    if(!credential)throw new Error("기기 확인이 취소됐습니다.");
    created=true;
    const payload={
      id:credential.id,rawId:encode(credential.rawId),type:credential.type,
      authenticatorAttachment:credential.authenticatorAttachment||undefined,
      clientExtensionResults:credential.getClientExtensionResults(),
      response:{
        clientDataJSON:encode(credential.response.clientDataJSON),
        attestationObject:encode(credential.response.attestationObject),
        transports:credential.response.getTransports?.()||[]
      }
    };
    status.textContent="등록 결과를 검증하고 공개키를 저장하고 있습니다.";
    const verified=await request("PUT",{credential:payload});
    record("2. 기기에서 서버로 보낸 등록 본문과 검증 응답","PUT",{credential:payload},verified);
    if(verified.status!==200||verified.body.verified!==true)throw new Error(verified.body.error||"공개키 저장 확인 실패");
    saved=true;
    const after=await request("GET");
    record("3. 등록 후 패스키 목록","GET",undefined,after);
    if(after.status!==200||after.body.count!==before.body.count+1)throw new Error("추가 후 목록 건수를 확인하지 못했습니다.");
    form.hidden=true;
    status.textContent="등록 성공: 패스키가 "+before.body.count+"개에서 "+after.body.count+"개로 늘었습니다.\n요청 본문에는 개인키와 비밀번호가 없습니다. 공개키는 등록 응답의 attestationObject에 포함되어 서버가 검증·저장합니다.\n아래 기록을 보관하고, 서버의 public_key 저장값도 SQL로 확인하세요.";
  } catch(error) {
    if(error.name==="NotAllowedError"||error.name==="AbortError"){
      status.textContent="기기 확인을 취소했거나 시간이 지났습니다. 새 공개키는 저장하지 않았습니다.";
    } else {
      status.textContent=(error.message||"검사 실패")+(saved?"\n공개키 저장은 성공했습니다. 다시 등록하지 말고 목록을 확인하세요.":created?"\n기기 생성은 됐지만 서버 완료는 확인하지 못했습니다. 바로 다시 등록하지 마세요.":"");
    }
  } finally {button.disabled=false;}
});
</script></main></body></html>
