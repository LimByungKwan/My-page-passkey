<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>로그인 검증 기록</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#202d25;font:15px/1.8 "Malgun Gothic",system-ui,sans-serif}main{max-width:900px;margin:40px auto;padding:0 20px}a{color:#1d4d3a}h1{font-size:28px}button{background:#1d4d3a;color:white;padding:14px 20px;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:18px;border:1px solid #c9cec4;border-radius:6px;font:13px/1.7 monospace}#status{white-space:pre-line}.ok{color:#1d4d3a}.error{color:#9c2424}:focus-visible{outline:3px solid #795100;outline-offset:4px}
</style>
</head>
<body><main>
<a href="/private.html">← 비공개 노트로 돌아가기</a>
<h1>서명 검증과 질문 재사용 확인</h1>
<p>등록한 패스키로 기기 확인을 한 번 진행합니다. 틀린 서명 → 정상 서명 → 정상 응답 재전송 순서로 요청합니다.</p>
<p>세션·쿠키 값은 표시하거나 저장하지 않습니다. 요청 본문의 공개 식별자와 서명은 검사 기록으로 표시합니다. 이 검사는 로그인 세션을 새로 만듭니다.</p>
<button id="run" type="button">패스키로 검사 시작</button>
<p id="status" role="status" aria-live="polite">준비됐습니다.</p>
<div id="results"></div>
<script>
"use strict";
const button = document.getElementById("run");
const status = document.getElementById("status");
const results = document.getElementById("results");
function decode(value) {
  const base = value.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(base + "=".repeat((4 - base.length % 4) % 4)), c => c.charCodeAt(0));
}
function encode(buffer) {
  let value = "";
  for (const byte of new Uint8Array(buffer)) value += String.fromCharCode(byte);
  return btoa(value).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function post(url, body) {
  const response = await fetch(url, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return { status: response.status, body: await response.json() };
}
function record(title, url, request, response) {
  const heading = document.createElement("h2");
  heading.textContent = title;
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify({
    time: new Date().toISOString(),
    request: { method: "POST", url, body: request },
    response
  }, null, 2);
  results.append(heading, pre);
}
button.addEventListener("click", async () => {
  if (button.disabled) return;
  button.disabled = true;
  results.replaceChildren();
  status.className = "";
  try {
    if (!window.isSecureContext || !window.PublicKeyCredential) {
      throw new Error("배포된 HTTPS 주소에서 패스키를 지원하는 브라우저로 열어 주세요.");
    }
    status.textContent = "새 로그인 질문을 준비하고 있습니다.";
    const issued = await post("/api/login-options", {});
    if (issued.status !== 200) throw new Error(issued.body.error || "질문 발급 실패");
    record("0. 새 로그인 질문", "/api/login-options", {}, issued);
    const options = issued.body.options;
    status.textContent = "기기에서 등록한 패스키를 확인해 주세요.";
    const credential = await navigator.credentials.get({
      publicKey: {
        ...options, challenge: decode(options.challenge),
        allowCredentials: (options.allowCredentials || []).map(item => ({
          ...item, id: decode(item.id)
        }))
      }
    });
    if (!credential) throw new Error("기기 확인이 취소됐습니다.");
    const payload = {
      id: credential.id, rawId: encode(credential.rawId), type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment || undefined,
      clientExtensionResults: credential.getClientExtensionResults(),
      response: {
        clientDataJSON: encode(credential.response.clientDataJSON),
        authenticatorData: encode(credential.response.authenticatorData),
        signature: encode(credential.response.signature),
        userHandle: credential.response.userHandle ? encode(credential.response.userHandle) : null
      }
    };
    const altered = JSON.parse(JSON.stringify(payload));
    const signature = decode(altered.response.signature);
    if (!signature.length) throw new Error("서명 데이터가 없습니다.");
    signature[signature.length - 1] ^= 1;
    altered.response.signature = encode(signature);
    status.textContent = "틀린 서명, 정상 서명, 재전송을 순서대로 확인하고 있습니다.";
    const bad = await post("/api/login-verify", { credential: altered });
    record("1. 틀린 서명: 401 예상", "/api/login-verify", { credential: altered }, bad);
    if (bad.status !== 401) throw new Error("틀린 서명의 거절 결과가 예상과 다릅니다. 아래 기록을 확인해 주세요.");
    const valid = await post("/api/login-verify", { credential: payload });
    record("2. 정상 서명: 200 예상", "/api/login-verify", { credential: payload }, valid);
    if (valid.status !== 200 || valid.body.verified !== true) throw new Error("정상 로그인에 실패했습니다. 아래 기록을 확인해 주세요.");
    const replay = await post("/api/login-verify", { credential: payload });
    record("3. 같은 응답 재전송: 400 예상", "/api/login-verify", { credential: payload }, replay);
    if (replay.status !== 400 || replay.body.error !== "만료되었거나 이미 사용한 로그인 질문입니다.") {
      throw new Error("재사용 질문 거절 결과가 예상과 다릅니다. 아래 기록을 확인해 주세요.");
    }
    status.className = "ok";
    status.textContent = "검사 통과: 틀린 서명 401 / 정상 서명 200 / 사용한 질문 재전송 400.\n아래 요청·응답 기록과 결과를 제출 증거로 보관해 주세요.";
  } catch (error) {
    status.className = "error";
    status.textContent = error.name === "NotAllowedError"
      ? "기기 확인을 취소했거나 확인 시간이 지났습니다."
      : (error.message || "검사를 완료하지 못했습니다.");
  } finally {
    button.disabled = false;
  }
});
</script></main></body></html>
