<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>삭제한 패스키 거절 확인</title>
<style>
*{box-sizing:border-box}body{background:#f6f4ed;color:#202d25;font:15px/1.8 "Malgun Gothic",system-ui,sans-serif;margin:0}
main{max-width:900px;margin:40px auto;padding:0 20px}a{color:#1d4d3a}h1{font-size:28px}
label{display:block;font-weight:700;margin:20px 0 8px}input{width:100%;padding:12px;font:inherit;border:1px solid #7d897e;border-radius:5px}
button{background:#1d4d3a;color:white;padding:14px 20px;border:0;border-radius:6px;font:inherit;cursor:pointer;margin-top:16px}button:disabled{opacity:.6}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:18px;border:1px solid #c9cec4;border-radius:6px;font:13px/1.7 monospace}
#status{white-space:pre-line}.ok{color:#1d4d3a}.error{color:#9c2424}:focus-visible{outline:3px solid #795100;outline-offset:4px}
</style></head><body><main>
<a href="/private.html">← 비공개 노트로 돌아가기</a>
<h1>삭제한 패스키로 로그인 거절 확인</h1>
<p>서버에서 삭제한 패스키를 기기에서 선택해 실제 로그인 응답을 보냅니다. 기기 저장소에서는 아직 해당 패스키를 삭제하지 마세요.</p>
<form id="test-form">
<label for="credential-id">삭제한 패스키의 공개 식별자 (선택)</label>
<input id="credential-id" maxlength="2048" autocomplete="off" spellcheck="false">
<p>입력칸을 비워 두어도 검사할 수 있습니다. 기기 선택 창에서 삭제했던 패스키가 남아 있는 Windows Hello를 선택하세요.</p>
<button id="run" type="submit">삭제한 패스키로 로그인 검사</button>
</form>
<p id="status" role="status" aria-live="polite">입력칸이 비어 있으면 그대로 검사하고 Windows Hello를 선택하세요.</p>
<div id="results"></div>
<script>
"use strict";
const form = document.getElementById("test-form");
const button = document.getElementById("run");
const input = document.getElementById("credential-id");
const status = document.getElementById("status");
const results = document.getElementById("results");
try {
  const saved = JSON.parse(sessionStorage.getItem("lastDeletedPasskey") || "null");
  if (saved && typeof saved.credentialId === "string") input.value = saved.credentialId;
} catch {}
function decode(value) {
  const base = value.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(base + "=".repeat((4 - base.length % 4) % 4)), c => c.charCodeAt(0));
}
function encode(buffer) {
  let value = "";
  for (const byte of new Uint8Array(buffer)) value += String.fromCharCode(byte);
  return btoa(value).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function post(url, body) {
  const response = await fetch(url, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  return { status: response.status, body: await response.json() };
}
function record(title, url, request, response) {
  const heading = document.createElement("h2");
  heading.textContent = title;
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify({
    time: new Date().toISOString(),
    request: { method: "POST", url, body: request },
    response
  }, null, 2);
  results.append(heading, pre);
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  if (button.disabled) return;
  const id = input.value.trim();
  if (id && !/^[A-Za-z0-9_-]{1,2048}$/.test(id)) {
    status.textContent = "삭제 기록의 credentialId 전체를 입력해 주세요.";
    return;
  }
  button.disabled = true;
  results.replaceChildren();
  status.className = "";
  try {
    if (!window.isSecureContext || !window.PublicKeyCredential) {
      throw new Error("배포된 HTTPS 주소에서 패스키 지원 브라우저로 열어 주세요.");
    }
    const [accountResponse, keysResponse] = await Promise.all([
      fetch("/api/private", { credentials: "same-origin", cache: "no-store" }),
      fetch("/api/passkeys", { credentials: "same-origin", cache: "no-store" })
    ]);
    if (accountResponse.status === 401 || keysResponse.status === 401) {
      throw new Error("먼저 비공개 노트에서 남아 있는 Google 패스키로 로그인한 뒤 이 페이지를 다시 여세요.");
    }
    if (!accountResponse.ok || !keysResponse.ok) throw new Error("현재 계정의 패스키 목록을 확인하지 못했습니다.");
    const account = await accountResponse.json();
    const keys = await keysResponse.json();
    if (typeof account.accountId !== "string" || !Array.isArray(keys.passkeys)) {
      throw new Error("계정 정보를 읽지 못했습니다.");
    }
    status.textContent = "새 로그인 질문을 준비하고 있습니다.";
    const issued = await post("/api/login-options", {});
    record("1. 새 질문 발급", "/api/login-options", {}, issued);
    if (issued.status !== 200) throw new Error(issued.body.error || "질문 발급 실패");
    const options = issued.body.options;
    status.textContent = "삭제했던 패스키가 남아 있는 저장소를 선택하세요. 첫 패스키가 Windows Hello였다면 Windows Hello를 사용하세요.";
    const credential = await navigator.credentials.get({
      publicKey: {
        ...options, challenge: decode(options.challenge),
        hints: ["client-device"],
        allowCredentials: id ? [{ type: "public-key", id: decode(id) }] : []
      }
    });
    if (!credential) throw new Error("기기 확인이 취소됐습니다.");
    if (id && credential.id !== id) throw new Error("선택된 패스키가 검사 대상과 다릅니다.");
    if (keys.passkeys.some(key => key.credential_id === credential.id)) {
      throw new Error("아직 등록된 패스키를 선택했습니다. 다시 검사하면서 삭제했던 패스키의 Windows Hello 저장소를 선택해 주세요.");
    }
    const userHandle = credential.response.userHandle;
    if (!userHandle ||
        new TextDecoder().decode(userHandle) !== account.accountId) {
      throw new Error("현재 계정의 패스키인지 확인하지 못했습니다. 삭제했던 같은 계정의 Windows Hello 패스키를 선택해 주세요.");
    }
    const payload = {
      id: credential.id, rawId: encode(credential.rawId), type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment || undefined,
      clientExtensionResults: credential.getClientExtensionResults(),
      response: {
        clientDataJSON: encode(credential.response.clientDataJSON),
        authenticatorData: encode(credential.response.authenticatorData),
        signature: encode(credential.response.signature),
        userHandle: credential.response.userHandle ? encode(credential.response.userHandle) : null
      }
    };
    status.textContent = "기기가 만든 응답을 서버에 보내 거절되는지 확인하고 있습니다.";
    const rejected = await post("/api/login-verify", { credential: payload });
    record("2. 삭제한 패스키의 실제 로그인 응답", "/api/login-verify", { credential: payload }, rejected);
    if (rejected.status !== 401 ||
        rejected.body.error !== "등록되지 않았거나 삭제된 패스키입니다.") {
      throw new Error("예상과 다른 결과입니다. 아래 요청·응답을 확인해 주세요.");
    }
    status.className = "ok";
    status.textContent = "검사 통과: 삭제한 패스키의 실제 로그인 요청을 서버가 401로 거절했습니다.\n세션·쿠키 값은 출력하지 않았습니다. 결과를 제출 증거로 보관해 주세요.";
  } catch (error) {
    status.className = "error";
    status.textContent = error.name === "NotAllowedError"
      ? "기기에서 해당 패스키를 찾지 못했거나 확인이 취소됐습니다. 아직 서버 거절 검증은 완료되지 않았습니다."
      : (error.message || "검사를 완료하지 못했습니다.");
  } finally { button.disabled = false; }
});
</script></main></body></html>
